name: Shared VedicStar Deployment
on:
  push:
    branches: [main]
  # Opt-in only: the label runs the image build against THIS pull request. Off by default, so an ordinary
  # PR never consumes prod-environment credentials or registry time, and the main-only gate below is untouched.
  # `labeled` is required or adding the label could never start a run; the other three types are the
  # defaults, kept explicit because stating `types:` replaces them.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'src/**'
      - 'tests/**'
      - '*sln*'
      - 'Directory.Build.props'
      - 'global.json'
      - 'nuget.config'
      - '.editorconfig'
      - 'deploy/**'
      - 'docs/**'
      - '.github/**'
  workflow_dispatch:
    inputs:
      verify_image_build:
        description: 'Build the deploy image without deploying. Does not run deploy-prod and does not touch Azure deploy state.'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: vedicstar-shared-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate-day:
    uses: ./.github/workflows/myvedicday-ci.yml
    permissions:
      contents: read
      packages: read
    secrets: inherit
  validate-star:
    uses: ./.github/workflows/authorize-api.yml
    permissions:
      contents: read
      packages: read
    secrets: inherit
  validate-host:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Test shared host
        run: dotnet test tests/MyVedicStar.Host.Tests.Integration/MyVedicStar.Host.Tests.Integration.csproj --configuration Release --logger trx --results-directory host-test-results
      - name: Verify deployment contract
        shell: pwsh
        run: |
          ./tests/deployment/DeploymentContract.Tests.ps1
          ./tests/deployment/MigrationContract.Tests.ps1
          # Api#193: fail if the image-build gate stops being observable, or if deploy-prod loses its guard.
          ./tests/deployment/ImageBuildObservability.Tests.ps1
          # Api#214: a failed migration must print the job's own log, not just a generic verdict.
          ./tests/deployment/MigrationFailureDiagnostics.Tests.ps1
      - name: Verify combined publish
        run: dotnet publish src/MyVedicStar.API/MyVedicStar.API.csproj --configuration Release --no-restore --output combined-publish -p:UseAppHost=false
      - name: Smoke test published host
        shell: pwsh
        run: ./tests/deployment/PublishedHost.Smoke.Tests.ps1 -PublishDirectory combined-publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-test-results
          path: host-test-results/*.trx
  build-image:
    needs: [validate-day, validate-star, validate-host]
    # Never weakened for real deploys: a push to main still builds here, exactly as before.
    # The two added arms are OPT-IN verification paths - they build the image against a pull request so the
    # build is provable before merge, and neither reaches deploy-prod (guarded below).
    # Api#193: this job used to run only on main, so every PR rollup showed it SKIPPED and a broken image
    # build was first discovered on main. See verify-image-build for the self-describing skip.
    if: >-
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      || github.event_name == 'workflow_dispatch' && inputs.verify_image_build
      || github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, vars.IMAGE_BUILD_LABEL || 'verify-image-build')
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build combined image
        shell: pwsh
        env:
          REGISTRY_NAME: ${{ vars.REGISTRY_NAME }}
          IMAGE_TAG: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./deploy/scripts/build-image.ps1

      # api#193 acceptance: the image build must be shown to CONTAIN the toolkit, not merely to finish.
      # This asserts inside the built artefact, so a Dockerfile that quietly stopped copying the library
      # (or a provisioning stage that silently produced nothing) fails here rather than in production at
      # the first request that needs a position.
      - name: The built image contains the SPICE toolkit and its kernels
        shell: bash
        env:
          REGISTRY_NAME: ${{ vars.REGISTRY_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The repository name comes from deploy/scripts/_common.ps1:14 ($script:ImageRepository = 'myvedicstar-api')
          # and build-image.ps1:39 builds "$($ImageRepository):$ImageTag". "myvedicstar-combined" appears in this
          # repository only as the temp publish-directory prefix (build-image.ps1:46) and is not an image that exists,
          # so asserting on it would fail for the wrong reason - a pull of a name nothing ever built.
          image="${REGISTRY_NAME}.azurecr.io/myvedicstar-api:${IMAGE_TAG}"
          az acr login --name "$REGISTRY_NAME"
          docker pull "$image"

          # The runtime stage is CHISELED and has NO SHELL, so 'docker run ls' and 'sh -c test -f'
          # cannot work here - they would fail for a reason unrelated to the toolkit and would look
          # like a missing library. Read the image filesystem directly instead, which needs no shell
          # and no entrypoint override.
          container=$(docker create "$image")
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT

          # One pass over the filesystem listing rather than one export per file: the export is the
          # expensive part, and a per-file loop also hides which files were actually present.
          listing="$RUNNER_TEMP/image-files.txt"
          docker export "$container" | tar -tf - > "$listing"

          required=(usr/lib/libcspice.so var/spice/de440.bsp var/spice/naif0012.tls var/spice/pck00011.tpc)
          missing=()
          for path in "${required[@]}"; do
            grep -qx "$path" "$listing" || missing+=("$path")
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::the built image is missing the SPICE toolkit or kernels:"
            printf '  - /%s\n' "${missing[@]}"
            echo "::error::api#193 requires the shipped image to carry the pinned toolkit, not just to build."
            echo "::error::File count in image: $(wc -l < "$listing")"
            exit 1
          fi

          echo "Image $image contains libcspice.so and the three pinned kernels."

      - name: Build migration image
        shell: pwsh
        env:
          REGISTRY_NAME: ${{ vars.REGISTRY_NAME }}
          IMAGE_TAG: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./deploy/scripts/build-migrator.ps1
  # Api#193: a skipped job is not a passed job. build-image cannot report "did not run" in a way a reviewer
  # can tell apart from "not applicable", because a skipped job's conclusion is `skipped` and its run list
  # entry is indistinguishable from one that was never required. GitHub has already converted `skipped` to
  # passing in #193's rollup twice.
  #
  # Mechanism: this job ALWAYS runs (no `if:` that could skip it), and its NAME carries the outcome -
  # "image build SKIPPED (not requested)" vs "image build REQUIRED". GitHub check names are rendered in the
  # PR rollup next to their status, so the distinguishing information survives into the only surface a
  # reviewer actually reads, instead of living in a log they would have to open. The step output repeats it
  # and the job summary records the reason.
  #
  # Deliberately NOT relying on: a required status check (cannot express "required only when it should run"),
  # or `continue-on-error` (that turns a real failure into a pass - the exact defect being fixed).
  verify-image-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Decide whether the deploy image build was requested
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_VERIFY: ${{ inputs.verify_image_build }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          LABEL_NAME: ${{ vars.IMAGE_BUILD_LABEL || 'verify-image-build' }}
        run: |
          $onMain = $env:REF -eq 'refs/heads/main' -and $env:EVENT_NAME -ne 'pull_request'
          $labels = @($env:PR_LABELS -split ',' | Where-Object { $_ })
          $inputRequested = $env:INPUT_VERIFY -eq 'true'
          $labelRequested = $labels -contains $env:LABEL_NAME
          if ($onMain) {
            $reason = 'push to main: the build runs as part of the deploy path'
            $state = 'REQUIRED'
          } elseif ($inputRequested) {
            $reason = "workflow_dispatch with verify_image_build=true"
            $state = 'REQUIRED'
          } elseif ($labelRequested) {
            $reason = "pull request labelled '$($env:LABEL_NAME)'"
            $state = 'REQUIRED'
          } else {
            $reason = "not on main, verify_image_build not set, and the pull request is not labelled '$($env:LABEL_NAME)'"
            $state = 'SKIPPED (not requested)'
          }
          Write-Host "Deploy image build: $state"
          Write-Host "Reason: $reason"
          "image-build-state=$state" >> $env:GITHUB_OUTPUT
          "### Deploy image build: **$state**`n`n$reason" >> $env:GITHUB_STEP_SUMMARY
          # Fails loudly rather than silently if a reviewer asked for the build and it will not happen.
          if ($inputRequested -and -not $onMain) {
            Write-Host '::notice::verify_image_build=true was set; build-image will run against this ref.'
          }

  deploy-prod:
    needs: [build-image, verify-image-build]
    # Unchanged in effect and now stated explicitly: a real deploy only ever follows a build on main.
    if: >-
      always()
      && needs.build-image.result == 'success'
      && github.ref == 'refs/heads/main'
      && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: ${{ steps.deploy.outputs.app-url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Apply database migrations
        shell: pwsh
        env:
          REGISTRY_NAME: ${{ vars.REGISTRY_NAME }}
          IMAGE_TAG: ${{ github.sha }}
          RESOURCE_GROUP_NAME: ${{ vars.RESOURCE_GROUP_NAME }}
          MIGRATION_JOB_RESOURCE_ID: ${{ vars.MIGRATION_JOB_RESOURCE_ID || '/subscriptions/e77bb964-ac4f-44f5-89eb-ba00a5d889d1/resourceGroups/rg-myvedicstar-prod-app-eus2/providers/Microsoft.App/jobs/caj-myvedicstar-migrate-prod' }}
        run: ./deploy/scripts/run-migrations.ps1
      - name: Deploy both APIs to VedicStar
        id: deploy
        shell: pwsh
        env:
          DEPLOY_ENVIRONMENT: prod
          IMAGE_TAG: ${{ github.sha }}
          REGISTRY_NAME: ${{ vars.REGISTRY_NAME }}
          RESOURCE_GROUP_NAME: ${{ vars.RESOURCE_GROUP_NAME }}
          CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME || 'ca-myvedicstar-api-prod' }}
        run: ./deploy/scripts/deploy-app.ps1
