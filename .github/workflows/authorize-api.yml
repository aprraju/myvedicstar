# CI for every PR; on main also builds the image and releases it to prod.
# Infrastructure is managed by Terraform; this workflow only builds the image and updates the existing
# Container App (deploy/scripts/deploy-app.ps1).
#
# Azure sign-in uses OpenID Connect: no Azure credentials are stored in GitHub. The app registration in
# AZURE_CLIENT_ID needs a federated credential whose subject matches the token exactly; this repository
# uses immutable IDs:  repo:aprraju@867910/myvedicstar@1396964516:environment:prod
#
# Repository variables used (not secrets: none of the values is sensitive):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
#   REGISTRY_NAME, REGISTRY_RESOURCE_GROUP, RESOURCE_GROUP_NAME, CONTAINER_APP_NAME

name: Authorize API

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'deploy/**'
      - 'MyVedicStar.slnx'
      - '.dockerignore'
      - '.github/workflows/authorize-api*.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authorize-api-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MyVedicStar.slnx
      - name: Check for vulnerable packages
        run: |
          dotnet list MyVedicStar.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -q -i "has the following vulnerable packages" vulnerable.txt
      - name: Build
        run: dotnet build MyVedicStar.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test MyVedicStar.slnx --no-build --configuration Release

      - name: Validate deployment configuration
        shell: pwsh
        run: Get-ChildItem deploy/environments -Filter *.json | ForEach-Object { Get-Content -Raw $_.FullName | ConvertFrom-Json | Out-Null }
      - name: Analyze deployment scripts
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          }
          $findings = Invoke-ScriptAnalyzer -Path deploy/scripts -Recurse -Severity Error, Warning `
            -ExcludeRule PSAvoidUsingWriteHost, PSUseShouldProcessForStateChangingFunctions
          $findings | Format-Table -AutoSize | Out-String | Write-Host
          if ($findings | Where-Object Severity -eq 'Error') { throw 'PSScriptAnalyzer reported errors.' }

  build-image:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    outputs:
      image-tag: ${{ steps.build.outputs.image-tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build image in Azure Container Registry
        id: build
        shell: pwsh
        env:
          REGISTRY_NAME: ${{ vars.REGISTRY_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: ./deploy/scripts/build-image.ps1

  deploy-prod:
    needs: build-image
    uses: ./.github/workflows/authorize-api-deploy.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: prod
      image-tag: ${{ needs.build-image.outputs.image-tag }}
