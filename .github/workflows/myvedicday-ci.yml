name: MyVedicDay API CI

on:
  pull_request:
    paths:
      - 'src/SharedApi/**'
      - 'src/GeoNames/**'
      - 'src/MyVedicStar.API/**'
      - 'src/MyVedicStar.Authorize.Business/**'
      - 'src/MyVedicStar.Caching/**'
      - 'src/MyVedicStar.Authorize.Data/**'
      - 'src/MyVedicStar.Shared/**'
      - 'tests/MyVedicStar.Caching.Tests/**'
      - 'src/MyVedicDay.*/**'
      - 'astronomy/**'
      - 'tests/MyVedicDay.*/**'
      - 'MyVedicDay.sln'
      - 'Directory.Build.props'
      - 'global.json'
      - 'nuget.config'
      - '.editorconfig'
      - '.github/scripts/**'
      - '.github/workflows/myvedicday-ci.yml'
  push:
    branches-ignore: [main]
    paths:
      - 'src/SharedApi/**'
      - 'src/GeoNames/**'
      - 'src/MyVedicStar.API/**'
      - 'src/MyVedicStar.Authorize.Business/**'
      - 'src/MyVedicStar.Caching/**'
      - 'src/MyVedicStar.Authorize.Data/**'
      - 'src/MyVedicStar.Shared/**'
      - 'tests/MyVedicStar.Caching.Tests/**'
      - 'src/MyVedicDay.*/**'
      - 'astronomy/**'
      - 'tests/MyVedicDay.*/**'
      - 'MyVedicDay.sln'
      - 'Directory.Build.props'
      - 'global.json'
      - 'nuget.config'
      - '.editorconfig'
      - '.github/scripts/**'
      - '.github/workflows/myvedicday-ci.yml' 
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  code-scan:
    # Push and PR runs always scan; a manual run can skip it, and a redeploy never runs it. Every check reports
    # and exits 0, and the job is also continue-on-error, so the scan can never fail the workflow. Nothing depends on it.
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # read by nuget.config for GitHub Packages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'nuget.config') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        id: restore
        continue-on-error: true
        run: dotnet restore MyVedicDay.sln
      - name: Compiler and .NET analyzers
        if: steps.restore.outcome == 'success'
        shell: pwsh
        run: ./.github/scripts/code-scan.ps1 -Check Analyzers -Solution MyVedicDay.sln
      - name: Code style
        if: steps.restore.outcome == 'success'
        shell: pwsh
        run: ./.github/scripts/code-scan.ps1 -Check Format -Solution MyVedicDay.sln
      - name: Vulnerable packages
        if: steps.restore.outcome == 'success'
        shell: pwsh
        run: ./.github/scripts/code-scan.ps1 -Check Packages -Solution MyVedicDay.sln
      - name: Deployment scripts
        shell: pwsh
        run: ./.github/scripts/code-scan.ps1 -Check Scripts
      - name: Report skipped checks
        if: steps.restore.outcome != 'success'
        run: echo "::warning title=Code scan incomplete::Package restore failed, so analyzer, style and package checks were skipped. The test job reports the cause."

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read    # restore MyVedicStar.* packages from GitHub Packages
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cache_test
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cache_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore NuGet packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet restore MyVedicDay.sln

      - name: Run tests
        env:
          MYVEDICSTAR_TEST_POSTGRES: Host=localhost;Port=5432;Database=postgres;Username=cache_test;Password=ci_only
        run: |
          dotnet test MyVedicDay.sln \
            --configuration Release \
            --no-restore \
            --logger trx \
            --results-directory ./test-results

      - name: Upload test results
        # Always upload so failures are visible even when the step above exits non-zero.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: day-test-results
          path: ./test-results/*.trx
          retention-days: 7

