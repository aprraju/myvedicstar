name: Top-level directory coverage

# api#90: a NEW top-level directory must go red until somebody decides which workflows must cover it.
#
# This workflow deliberately has NO paths: filter on pull_request. A check that only runs when
# certain files change inherits exactly the blind spot it exists to detect - a PR adding
# astronomy/ would never start it, and a check that reads green by not running is worse than no
# check, because it looks like coverage. The job inspects the repository's own workflows, so it
# needs no .NET SDK and no restore.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: top-level-dir-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  top-level-dir-coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # api#125: the checker only ever ran against the repo as it is, so a green run proved the
      # current configuration was covered but never that a violation would be noticed. These cases
      # pin the falsification - a single-star filter must be red - and must run BEFORE the real check,
      # so a broken checker cannot report "every directory is covered".
      - name: The coverage checker detects nested-only gaps
        run: python3 .github/scripts/test_check-top-level-dir-coverage.py

      # api#90: the guard's own guard. These tests run the SAME script CI runs, against scratch repositories, and
      # assert the red case first: a new top-level directory with no matching paths: filter fails the run and names
      # itself. A check whose failure path is untested is a check that might only ever be green.
      - name: The coverage guard fails when it should
        run: python3 .github/scripts/tests/test_top_level_dir_coverage.py

      - name: Every top-level directory is covered by a workflow path filter
        run: python3 .github/scripts/check-top-level-dir-coverage.py
