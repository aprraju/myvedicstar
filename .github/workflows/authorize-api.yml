name: MyVedicStar API CI
on:
  pull_request:
    paths:
      - 'src/SharedApi/**'
      - 'src/MyVedicDay.*/**'
      - 'src/GeoNames/**'
      - 'src/MyVedicStar.Caching/**'
      - 'tests/MyVedicStar.Caching.Tests/**'
      - 'src/MyVedicStar.*/**'
      - 'tests/MyVedicStar.*/**'
      - 'MyVedicStar.slnx'
      - 'Directory.Build.props'
      - 'global.json'
      - 'nuget.config'
      - '.editorconfig'
      - '.github/workflows/authorize-api.yml'
      - '.github/scripts/**'
  push:
    branches-ignore: [main]
    paths:
      - 'src/SharedApi/**'
      - 'src/MyVedicDay.*/**'
      - 'src/GeoNames/**'
      - 'src/MyVedicStar.Caching/**'
      - 'tests/MyVedicStar.Caching.Tests/**'
      - 'src/MyVedicStar.*/**'
      - 'tests/MyVedicStar.*/**'
      - 'MyVedicStar.slnx'
      - 'Directory.Build.props'
      - 'global.json'
      - 'nuget.config'
      - '.editorconfig'
      - '.github/workflows/authorize-api.yml'
      - '.github/scripts/**'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  code-scan:
    # Push and PR runs always scan; a manual run can skip it, and a redeploy never runs it. Every check reports
    # and exits 0, and the job is also continue-on-error, so the scan can never fail the workflow. Nothing depends on it.
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # read by nuget.config for GitHub Packages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'nuget.config') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        id: restore
        continue-on-error: true
        run: dotnet restore MyVedicStar.slnx
      - name: Compiler and .NET analyzers
        if: steps.restore.outcome == 'success'
        shell: pwsh
        run: ./.github/scripts/code-scan.ps1 -Check Analyzers
      - name: Code style
        if: steps.restore.outcome == 'success'
        shell: pwsh
        run: ./.github/scripts/code-scan.ps1 -Check Format
      - name: Vulnerable packages
        if: steps.restore.outcome == 'success'
        shell: pwsh
        run: ./.github/scripts/code-scan.ps1 -Check Packages
      - name: Deployment scripts
        shell: pwsh
        run: ./.github/scripts/code-scan.ps1 -Check Scripts
      - name: Report skipped checks
        if: steps.restore.outcome != 'success'
        run: echo "::warning title=Code scan incomplete::Package restore failed, so analyzer, style and package checks were skipped. The test job reports the cause."

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      MYVEDICSTAR_TEST_POSTGRES: 'Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres'
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # read by nuget.config for GitHub Packages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'nuget.config') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore packages (nuget.org and GitHub Packages)
        id: restore
        run: dotnet restore MyVedicStar.slnx
      - name: Explain restore failure
        if: failure() && steps.restore.outcome == 'failure'
        run: |
          echo "::error title=Package restore failed::If the log shows 401/403 or 'NU1301' for nuget.pkg.github.com, the MyVedicStar.* package (aprraju/myvedistar-common) must grant this repository read access: package settings -> Manage Actions access. If it shows NU1101 for a MyVedicStar.* package, that version has not been published. Other packages come from nuget.org."

      - name: Build
        run: dotnet build MyVedicStar.slnx --no-restore --configuration Release
      - name: Test
        id: test
        run: >-
          dotnet test MyVedicStar.slnx --no-build --configuration Release
          --logger trx --results-directory TestResults
          --collect "XPlat Code Coverage"
      - name: Test summary
        if: always() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure')
        shell: pwsh
        run: |
          $rows = foreach ($file in Get-ChildItem TestResults -Recurse -Filter *.trx) {
            $counters = ([xml](Get-Content -Raw -LiteralPath $file.FullName)).TestRun.ResultSummary.Counters
            $name = [System.IO.Path]::GetFileNameWithoutExtension($file.Name)
            "| $name | $($counters.total) | $($counters.passed) | $($counters.failed) | $([int]$counters.notExecuted) |"
          }
          $coverage = @(Get-ChildItem TestResults -Recurse -Filter coverage.cobertura.xml).Count
          @(
            '### Tests', '',
            '| Results file | Total | Passed | Failed | Skipped |', '|---|---:|---:|---:|---:|'
            $rows
            '', "Coverage reports: $coverage (artifact ``test-results``)."
          ) -join "`n" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
      - name: Upload test results
        if: always() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: star-test-results
          path: TestResults
          retention-days: 14

      - name: Validate deployment configuration
        shell: pwsh
        run: Get-ChildItem deploy/environments -Filter *.json | ForEach-Object { Get-Content -Raw $_.FullName | ConvertFrom-Json | Out-Null }

