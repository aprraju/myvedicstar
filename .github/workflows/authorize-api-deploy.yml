# Releases an already-built image to the existing Container App. Called by authorize-api.yml; run it
# manually to redeploy or roll back to any previously built tag (a git commit SHA).

name: Authorize API - deploy

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      image-tag:
        type: string
        required: true
    outputs:
      app-url:
        value: ${{ jobs.deploy.outputs.app-url }}
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [ prod ]
        default: prod
        required: true
      image-tag:
        description: Image tag (git commit SHA) already in the registry
        type: string
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.app-url }}
    concurrency:
      group: authorize-api-deploy-${{ inputs.environment }}
      cancel-in-progress: false
    outputs:
      app-url: ${{ steps.deploy.outputs.app-url }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy to Container App
        id: deploy
        shell: pwsh
        # Inputs reach the script as environment variables, never interpolated into script text.
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          IMAGE_TAG: ${{ inputs.image-tag }}
          REGISTRY_NAME: ${{ vars.REGISTRY_NAME }}
          RESOURCE_GROUP_NAME: ${{ vars.RESOURCE_GROUP_NAME }}
          CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}
        run: ./deploy/scripts/deploy-app.ps1
